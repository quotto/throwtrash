env:
  commonjs: true
  es6: true
  node: true
  jest: true
extends:
  - "eslint:recommended"
  - "plugin:@typescript-eslint/recommended"
parser: "@typescript-eslint/parser"
globals:
  Atomics: readonly
  SharedArrayBuffer: readonly
parserOptions:
  ecmaVersion: 2022
  sourceType: module
ignorePatterns:
  - "api-dist/**"
rules: 
  no-unused-vars: "off"
  "@typescript-eslint/no-unused-vars": "off"
  "@typescript-eslint/no-explicit-any": "off"
  "@typescript-eslint/ban-types": "off"
