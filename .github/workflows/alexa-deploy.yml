name: alexa-deploy
on:
  push:
    branches-ignore:
      - main
    paths:
      - "apps/alexa/**"
      - "packages/trash-common/**"
      - ".github/**"
  pull_request:
    branches:
      - release
    types: [opened, synchronize]
    paths:
      - "apps/alexa/**"
      - "packages/trash-common/**"
      - ".github/**"
  push:
    branches-ignore:
      - main
    paths:
      - "apps/alexa/**"
      - "packages/trash-common/**"
      - ".github/**"
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm --filter alexa... install --frozen-lockfile
      - name: build
        run: |
          pnpm --filter alexa... run build
      - name: test
        run: |
          sudo npm install -g ask-cli@2.1.1 --unsafe-perm
          mkdir -p ~/.ask
          echo "${{ secrets.ASK_CLI_CONFIG }}" > ~/.ask/cli_config
          export APP_ID=$APPID
          pnpm --filter alexa run test
  set-stage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.set-stage.outputs.stage }}
    steps:
      - name: Set stage
        id: set-stage
        run: |
          if [ "${{ github.ref }}" = "refs/heads/deploy" ] || [ "${{ github.ref }}" = "refs/heads/release" ]; then
            echo "stage=prod" >> "$GITHUB_OUTPUT"
          else
            echo "stage=dev" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    if: github.event_name == 'push'
    needs:
      - test
      - set-stage
    environment: ${{ needs.set-stage.outputs.stage }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-skill-deploy-role
          role-session-name: GitHubActions
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm --filter alexa... install --frozen-lockfile
      - name: build
        run: |
          pnpm --filter alexa... run build
      - name: test
        if: github.event_name == 'push'
        run: |
          sudo npm install -g ask-cli@2.1.1 --unsafe-perm
          mkdir -p ~/.ask
          echo "${{ secrets.ASK_CLI_CONFIG }}" > ~/.ask/cli_config
          export APP_ID=$APPID
          pnpm --filter alexa run test
      - name: layer-install
        run: |
          pnpm --config.node-linker=hoisted --filter alexa deploy --prod apps/alexa/app/deploy
          layer_root="apps/alexa/app/layer/nodejs"
          rm -rf "${layer_root}"
          mkdir -p "${layer_root}"
          mv "apps/alexa/app/deploy/node_modules" "${layer_root}/node_modules"
      - uses: hashicorp/setup-terraform@v3
      - name: terraform-init
        working-directory: apps/alexa
        run: |
          # Terraformの初期化
          terraform init -backend-config="region=${{ vars.AWS_DEFAULT_REGION }}" -backend-config="bucket=throwtrash-tfstate-${{ needs.set-stage.outputs.stage }}"
          # TFVARファイルを作成
          echo "AppID=\"${{ vars.ALEXA_APP_ID }}\"" >> terraform.tfvars
          echo "ApiUrl=\"${{ vars.MECAB_API_URL }}\"" >> terraform.tfvars
          echo "ApiKey=\"${{ secrets.MECAB_API_KEY }}\"" >> terraform.tfvars
          echo "ReminderProductID=\"${{ vars.REMINDER_PRODUCT_ID }}\"" >> terraform.tfvars
          echo "RunLevel=\"${{ vars.RUNLEVEL }}\"" >> terraform.tfvars
          echo "stage=\"${{ needs.set-stage.outputs.stage }}\"" >> terraform.tfvars
      - name: terraform-plan
        working-directory: apps/alexa
        run: terraform plan -var-file=terraform.tfvars -no-color
      - name: terraform-apply
        working-directory: apps/alexa
        run: terraform apply -auto-approve -var-file=terraform.tfvars
  release-versioning:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs:
      - deploy
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-skill-deploy-role
          role-session-name: GitHubActions
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
      - name: Publish Lambda version
        id: versioning
        run: |
          set -euo pipefail
          publish_version=$(aws lambda publish-version --function-name ThrowTrashSkill --query 'Version' --output text)
          echo "publish_version=${publish_version}" >> "$GITHUB_OUTPUT"
          aws lambda add-permission \
            --function-name "ThrowTrashSkill:${publish_version}" \
            --statement-id alexa \
            --action lambda:InvokeFunction \
            --principal alexa-appkit.amazon.com \
            --event-source-token "${{ vars.ALEXA_APP_ID }}"
      - name: Switch BLUE/GREEN alias
        run: |
          set -euo pipefail
          release_version=$(aws lambda get-alias --function-name ThrowTrashSkill --name RELEASE --query 'FunctionVersion' --output text 2>/dev/null || true)
          blue_version=$(aws lambda get-alias --function-name ThrowTrashSkill --name BLUE --query 'FunctionVersion' --output text 2>/dev/null || true)
          green_version=$(aws lambda get-alias --function-name ThrowTrashSkill --name GREEN --query 'FunctionVersion' --output text 2>/dev/null || true)
          publish_version="${{ steps.versioning.outputs.publish_version }}"

          target_alias=""
          if [[ -n "${release_version}" && -n "${blue_version}" && "${blue_version}" != "${release_version}" ]]; then
            target_alias="BLUE"
          elif [[ -n "${release_version}" && -n "${green_version}" && "${green_version}" != "${release_version}" ]]; then
            target_alias="GREEN"
          elif [[ -z "${blue_version}" || "${blue_version}" == "${release_version}" ]]; then
            target_alias="BLUE"
          else
            target_alias="GREEN"
          fi

          if aws lambda get-alias --function-name ThrowTrashSkill --name "${target_alias}" >/dev/null 2>&1; then
            aws lambda update-alias --function-name ThrowTrashSkill --name "${target_alias}" --function-version "${publish_version}"
          else
            aws lambda create-alias --function-name ThrowTrashSkill --name "${target_alias}" --function-version "${publish_version}"
          fi
