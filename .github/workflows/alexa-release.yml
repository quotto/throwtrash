name: alexa-release
on:
  push:
    branches:
      - main
    paths:
      - "apps/alexa/**"
      - "packages/trash-common/**"
      - ".github/**"
permissions:
  id-token: write
  contents: read
jobs:
  release:
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-skill-deploy-role
          role-session-name: GitHubActions
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
      - name: Resolve release target version
        id: resolve-version
        run: |
          set -euo pipefail
          release_version=$(aws lambda get-alias --function-name ThrowTrashSkill --name RELEASE --query 'FunctionVersion' --output text 2>/dev/null || true)
          blue_version=$(aws lambda get-alias --function-name ThrowTrashSkill --name BLUE --query 'FunctionVersion' --output text 2>/dev/null || true)
          green_version=$(aws lambda get-alias --function-name ThrowTrashSkill --name GREEN --query 'FunctionVersion' --output text 2>/dev/null || true)

          target_alias=""
          target_version=""

          if [[ -z "${release_version}" ]]; then
            if [[ -n "${blue_version}" ]]; then
              target_alias="BLUE"
              target_version="${blue_version}"
            elif [[ -n "${green_version}" ]]; then
              target_alias="GREEN"
              target_version="${green_version}"
            fi
          elif [[ -n "${blue_version}" && "${blue_version}" != "${release_version}" ]]; then
            target_alias="BLUE"
            target_version="${blue_version}"
          elif [[ -n "${green_version}" && "${green_version}" != "${release_version}" ]]; then
            target_alias="GREEN"
            target_version="${green_version}"
          fi

          if [[ -z "${target_version}" ]]; then
            echo "RELEASE と異なるバージョンを持つ BLUE/GREEN エイリアスが見つかりません。"
            exit 1
          fi

          echo "target_alias=${target_alias}" >> "$GITHUB_OUTPUT"
          echo "target_version=${target_version}" >> "$GITHUB_OUTPUT"
      - name: Switch RELEASE alias
        run: |
          aws lambda update-alias \
            --function-name ThrowTrashSkill \
            --name RELEASE \
            --function-version "${{ steps.resolve-version.outputs.target_version }}"
