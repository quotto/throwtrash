name: Production Create Changeset

permissions:
  contents: read
  id-token: write
  pull-requests: write

on:
  pull_request:
   types: [opened, reopened, synchronize]
   branches:
     - deploy
   paths:
     - "apps/throwtrash-web/**"
     - "packages/trash-common/**"
     - ".github/**"

jobs:
  get-pr-number:
    runs-on: ubuntu-latest
    outputs:
      PR_NUMBER: ${{ steps.pr.outputs.PR_NUMBER }}
    steps:
      - uses: actions/checkout@v4
      - name: Get PR number
        id: pr
        run: echo "PR_NUMBER=$(echo $GITHUB_REF | cut -d'/' -f3)" >> $GITHUB_OUTPUT
  backend-test:
    environment: dev
    permissions:
      checks: write
      pull-requests: write
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-api-tester-role
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set GCP Credentials
        run: |
          echo ${{ secrets.GCP_TEST_CREDENTIALS }} | base64 -d > apps/throwtrash-web/backend/serviceAccountKey.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ github.workspace }}/apps/throwtrash-web/backend/serviceAccountKey.json" >> $GITHUB_ENV
      - name: Run tests and report coverage
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          working-directory: apps/throwtrash-web/backend
  mobile-backend-test:
    permissions:
      checks: write
      pull-requests: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests and report coverage
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          working-directory: apps/throwtrash-web/api
  backend-changeset:
    needs: ["get-pr-number", "backend-test"]
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AWS Set up
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-api-deploy-role
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
      - name: build backend
        uses: ./.github/actions/backend/build
      - name: Set GCP Credentials
        run: |
          echo ${{ secrets.GCP_CREDENTIALS }} | base64 -d > apps/throwtrash-web/backend/deploy/dist/serviceAccountKey.json
      - name: Create Changeset for Backend DB
        run: |
          if aws cloudformation describe-stacks --stack-name throwtrash-backend-db --region=${{ vars.AWS_DEFAULT_REGION }} >/dev/null 2>&1; then
            CHANGESET_TYPE=UPDATE
          else
            CHANGESET_TYPE=CREATE
          fi
          aws cloudformation create-change-set --stack-name throwtrash-backend-db --template-body file://apps/throwtrash-web/backend/cfn/db-template.yml --role-arn arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-api-deploy-cfn-role --capabilities CAPABILITY_NAMED_IAM --change-set-name "deploy-${{ needs.get-pr-number.outputs.PR_NUMBER }}" --change-set-type ${CHANGESET_TYPE} --region=${{ vars.AWS_DEFAULT_REGION }}
      - name: Create Changeset for Backend
        run: |
            # API/Lambdaのパッケージングとデプロイ
            aws cloudformation package --template-file apps/throwtrash-web/backend/cfn/func-template.yml --output-template-file apps/throwtrash-web/backend/cfn/package-template.yml --s3-bucket lambda-function-deployment-prod --s3-prefix throwtrashbackend
            if aws cloudformation describe-stacks --stack-name throwtrash-backend-${{ vars.BACKEND_STAGE }} --region=${{ vars.AWS_DEFAULT_REGION }} >/dev/null 2>&1; then
              CHANGESET_TYPE=UPDATE
            else
              CHANGESET_TYPE=CREATE
            fi

            aws cloudformation create-change-set --stack-name throwtrash-backend-${{ vars.BACKEND_STAGE }} --template-body file://apps/throwtrash-web/backend/cfn/package-template.yml --change-set-name "deploy-${{ needs.get-pr-number.outputs.PR_NUMBER }}" --change-set-type ${CHANGESET_TYPE} --parameters ParameterKey=Stage,ParameterValue="${{ vars.BACKEND_STAGE }}" ParameterKey=FrontendUrl,ParameterValue="https://${{ vars.CF_DOMAIN_NAME }}/${{ vars.FRONTEND_STAGE }}" ParameterKey=AuthorizationEndpoint,ParameterValue="https://${{ vars.CF_DOMAIN_NAME }}/backend/${{ vars.BACKEND_STAGE }}" ParameterKey=AlexaClientID,ParameterValue="${{ secrets.ALEXA_CLIENT_ID }}" ParameterKey=AlexaClientSecret,ParameterValue="${{ secrets.ALEXA_CLIENT_SECRET }}" ParameterKey=GoogleClientID,ParameterValue="${{ secrets.GOOGLE_CLIENT_ID }}" ParameterKey=GoogleClientSecret,ParameterValue="${{ secrets.GOOGLE_CLIENT_SECRET }}" ParameterKey=RunLevel,ParameterValue="${{ vars.RUNLEVEL }}"  ParameterKey=AlexaUserClientID,ParameterValue="${{ secrets.ALEXA_USER_CLIENT_ID }}" ParameterKey=AlexaUserSecret,ParameterValue="${{ secrets.ALEXA_USER_SECRET }}" ParameterKey=GoogleUserClientID,ParameterValue="${{ secrets.GOOGLE_USER_CLIENT_ID }}" ParameterKey=GoogleUserSecret,ParameterValue="${{ secrets.GOOGLE_USER_SECRET }}" ParameterKey=AlexaSkillID,ParameterValue="${{ vars.ALEXA_APP_ID }}" --role-arn arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-api-deploy-cfn-role --capabilities CAPABILITY_NAMED_IAM
  mobile-backend-changeset:
    runs-on: ubuntu-latest
    needs: ["get-pr-number", "mobile-backend-test"]
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: AWS Set up
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-api-deploy-role
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
      - uses: ./.github/actions/mobile-backend/build
      - name: Create Changeset for Mobile Backend DB
        run: |
          if aws cloudformation describe-stacks --stack-name throwtrash-mobile-db --region=${{ vars.AWS_DEFAULT_REGION }} >/dev/null 2>&1; then
            CHANGESET_TYPE=UPDATE
          else
            CHANGESET_TYPE=CREATE
          fi
          aws cloudformation create-change-set --stack-name throwtrash-mobile-db --template-body file://apps/throwtrash-web/api/db-template.yml --change-set-name "deploy-${{ needs.get-pr-number.outputs.PR_NUMBER }}" --change-set-type ${CHANGESET_TYPE} --role-arn arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-api-deploy-cfn-role --capabilities CAPABILITY_NAMED_IAM --region=${{ vars.AWS_DEFAULT_REGION }}
      - name: Create Changeset for Mobile Backend
        run: |
          # API/Lambdaのパッケージングとデプロイ
          aws cloudformation package --template-file apps/throwtrash-web/api/func-template.yml --output-template-file apps/throwtrash-web/api/package-template.yml --s3-bucket lambda-function-deployment-prod --s3-prefix throwtrashapi
          if aws cloudformation describe-stacks --stack-name throwtrash-mobile-${{ vars.MOBILE_API_STAGE }} --region=${{ vars.AWS_DEFAULT_REGION }} >/dev/null 2>&1; then
            CHANGESET_TYPE=UPDATE
          else
            CHANGESET_TYPE=CREATE
          fi

          aws cloudformation create-change-set --stack-name throwtrash-mobile-${{ vars.MOBILE_API_STAGE }} --template-body file://apps/throwtrash-web/api/package-template.yml --change-set-name "deploy-${{ needs.get-pr-number.outputs.PR_NUMBER }}" --change-set-type ${CHANGESET_TYPE} --parameters ParameterKey=RunLevel,ParameterValue="${{ vars.RUNLEVEL }}" ParameterKey=Stage,ParameterValue="${{ vars.MOBILE_API_STAGE }}" ParameterKey=SkillStage,ParameterValue="${{ vars.SKILL_STAGE }}" ParameterKey=AlexaSkillID,ParameterValue="${{ vars.ALEXA_APP_ID }}" ParameterKey=AlexaClientID,ParameterValue="${{ secrets.ALEXA_CLIENT_ID }}" ParameterKey=AlexaClientSecret,ParameterValue="${{ secrets.ALEXA_CLIENT_SECRET }}" ParameterKey=AlexaUserClientID,ParameterValue="${{ secrets.ALEXA_USER_CLIENT_ID }}" ParameterKey=AuthorizationEndpoint,ParameterValue="https://${{ vars.CF_DOMAIN_NAME }}/backend/${{ vars.BACKEND_STAGE }}" ParameterKey=BackendApiKey,ParameterValue="${{ secrets.BACKEND_API_KEY }}" ParameterKey=FrontendUrl,ParameterValue="https://${{ vars.CF_DOMAIN_NAME }}/${{ vars.FRONTEND_STAGE }}" --role-arn arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-api-deploy-cfn-role --capabilities CAPABILITY_NAMED_IAM

  cloudfront-diff-comment:
    needs: ["backend-changeset", "mobile-backend-changeset"]
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AWS Set up
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-frontend-deploy-role
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - name: Install CDK dependencies
        run: pnpm install --frozen-lockfile
      - name: Run CDK diff (CloudFront)
        env:
          CF_STAGE: prod
          CF_DOMAIN_NAME: ${{ vars.CF_DOMAIN_NAME }}
          CF_CERT_ARN: ${{ vars.CF_CERT_ARN }}
          CF_BACKEND_API_DOMAIN: ${{ vars.CF_BACKEND_API_DOMAIN}}
          CF_MOBILE_API_DOMAIN: ${{ vars.CF_MOBILE_API_DOMAIN}}
          CF_ALARM_API_DOMAIN: ${{ vars.CF_ALARM_API_DOMAIN }}
          CF_FRONTEND_BUCKET: throwtrash
        run: |
          set +e
          pnpm --filter throwtrash-cloudfront run diff -- --context stage=prod --no-color > apps/throwtrash-web/infra/cdk/cdk-diff.txt
          echo "CDK_DIFF_EXIT_CODE=$?" >> $GITHUB_ENV
      - name: Add diff to PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'apps/throwtrash-web/infra/cdk/cdk-diff.txt';
            let body = '';
            if (fs.existsSync(path)) {
              body = fs.readFileSync(path, 'utf8');
            } else {
              body = 'cdk diff output not found.';
            }

            const exitCode = process.env.CDK_DIFF_EXIT_CODE || 'unknown';
            const maxLength = 60000;
            if (body.length > maxLength) {
              body = body.slice(0, maxLength) + '\n... (truncated)';
            }

            const comment = [
              '## CloudFront CDK diff (prod)',
              '',
              `exit code: ${exitCode}`,
              '',
              '```',
              body || '(no diff output)',
              '```'
            ].join('\\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
