name: Development Deploy
on:
  push:
    branches-ignore:
      - main
      - deploy
    paths:
      - "apps/throwtrash-web/**"
      - "packages/trash-common/**"
      - ".github/**"
permissions:
  id-token: write
  contents: read

jobs:
  set-stage:
    runs-on: ubuntu-latest
    outputs:
      ENV: ${{ steps.set-stage.outputs.ENV }}
      BACKEND_STAGE: ${{ steps.set-stage.outputs.BACKEND_STAGE }}
      FRONTEND_STAGE: ${{ steps.set-stage.outputs.FRONTEND_STAGE }}
      MOBILE_API_STAGE: ${{ steps.set-stage.outputs.MOBILE_API_STAGE }}
    steps:
      - name: Set GitHub Actions Env
        id: set-stage
        run: |
          echo "ENV=dev" >> $GITHUB_OUTPUT
          # 開発デプロイの場合はブランチ名のハッシュをステージ変数に設定
          branch_hash=$(echo ${{ github.ref_name }} | md5sum | cut -c 1-5)
          echo "BACKEND_STAGE=$branch_hash" >> $GITHUB_OUTPUT
          echo "FRONTEND_STAGE=$branch_hash" >> $GITHUB_OUTPUT
          echo "MOBILE_API_STAGE=$branch_hash" >> $GITHUB_OUTPUT
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend lint
        run: pnpm --filter trashschedule-next run lint
      - name: Run frontend tests
        run: pnpm --filter trashschedule-next run test
  backend-test:
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-api-tester-role
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set GCP Credentials
        run: |
          echo ${{ secrets.GCP_TEST_CREDENTIALS }} | base64 -d > apps/throwtrash-web/backend/src/serviceAccountKey.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ github.workspace }}/apps/throwtrash-web/backend/src/serviceAccountKey.json" >> $GITHUB_ENV
      - name: Run backend tests
        run: pnpm --filter backend run coverage --coverage
  mobile-backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run API tests
        run: pnpm --filter api run test
  frontend-deploy:
    needs: ["set-stage", "frontend-test"]
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AWS Set up
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-frontend-deploy-role
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
      - uses: ./.github/actions/frontend/build
        with:
          frontend-stage: ${{ needs.set-stage.outputs.FRONTEND_STAGE }}
          api-base: ${{ vars.CF_DOMAIN_NAME }}/backend/${{ needs.set-stage.outputs.BACKEND_STAGE }}
      - uses: ./.github/actions/frontend/deploy
        with:
          frontend-stage: ${{ needs.set-stage.outputs.FRONTEND_STAGE }}
          bucket: throwtrash-dev
  backend-deploy:
    needs: ["set-stage", "backend-test"]
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AWS Set up
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-api-deploy-role
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
      - name: build backend
        uses: ./.github/actions/backend/build
      - name: Set GCP Credentials
        run: |
          echo ${{ secrets.GCP_TEST_CREDENTIALS }} | base64 -d > apps/throwtrash-web/backend/src/backend-dist/serviceAccountKey.json
      - name: Deploy DB
        run: |
          aws cloudformation deploy --template-file apps/throwtrash-web/backend/cfn/db-template.yml --stack-name throwtrash-backend-db --role-arn arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-api-deploy-cfn-role --capabilities CAPABILITY_NAMED_IAM --no-fail-on-empty-changeset --region=${{ vars.AWS_DEFAULT_REGION }}
      - name: Module Deploy Debug Info
        run: |
          pwd
          ls -la
          echo "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION"
          echo "vars.AWS_DEFAULT_REGION=${{ vars.AWS_DEFAULT_REGION }}"
          echo "ENV=${{ needs.set-stage.outputs.ENV }}"
          echo "BACKEND_STAGE=${{ needs.set-stage.outputs.BACKEND_STAGE }}"
          echo "FRONTEND_STAGE=${{ needs.set-stage.outputs.FRONTEND_STAGE }}"
          du -sh apps/throwtrash-web/backend/src/backend-dist
          du -sh apps/throwtrash-web/backend/src/backend-dist/node_modules || true
          du -sh apps/throwtrash-web/backend/src/layer || true
          du -sh apps/throwtrash-web/backend/src/layer/nodejs/node_modules || true
          find apps/throwtrash-web/backend/src/layer -type l | wc -l || true
          find apps/throwtrash-web/backend/src/layer -type f | wc -l || true
          du -sh apps/throwtrash-web/backend/src/layer/nodejs
          aws --version
          aws sts get-caller-identity
      - name: Module Deploy
        run: |
            set -x
            # API/Lambdaのパッケージングとデプロイ
            aws cloudformation package --template-file apps/throwtrash-web/backend/cfn/func-template.yml --output-template-file apps/throwtrash-web/backend/cfn/package-template.yml --s3-bucket lambda-function-deployment-${{ needs.set-stage.outputs.ENV }} --s3-prefix throwtrashbackend --debug

            aws cloudformation deploy --template-file apps/throwtrash-web/backend/cfn/package-template.yml --stack-name throwtrash-backend-${{ needs.set-stage.outputs.BACKEND_STAGE }} --parameter-overrides Stage=${{ needs.set-stage.outputs.BACKEND_STAGE }} FrontendUrl=https://${{ vars.CF_DOMAIN_NAME }}/${{ needs.set-stage.outputs.FRONTEND_STAGE }} AuthorizationEndpoint=https://${{ vars.CF_DOMAIN_NAME }}/backend/${{ needs.set-stage.outputs.BACKEND_STAGE }} AlexaClientID=${{ secrets.ALEXA_CLIENT_ID }} AlexaClientSecret=${{ secrets.ALEXA_CLIENT_SECRET }} GoogleClientID=${{ secrets.GOOGLE_CLIENT_ID }} GoogleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }} RunLevel=${{ vars.RUNLEVEL }}  AlexaUserClientID=${{ secrets.ALEXA_USER_CLIENT_ID }} AlexaUserSecret=${{ secrets.ALEXA_USER_SECRET }} GoogleUserClientID=${{ secrets.GOOGLE_USER_CLIENT_ID }} GoogleUserSecret=${{ secrets.GOOGLE_USER_SECRET }} AlexaSkillID=${{ vars.ALEXA_APP_ID }} --role-arn arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-api-deploy-cfn-role --capabilities CAPABILITY_NAMED_IAM --no-fail-on-empty-changeset
  mobile-backend-deploy:
    needs: ["mobile-backend-test","set-stage"]
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AWS Set up
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-api-deploy-role
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
      - uses: ./.github/actions/mobile-backend/build
      - name: Deploy DB
        run: |
          aws cloudformation deploy --template-file apps/throwtrash-web/api/db-template.yml --stack-name throwtrash-mobile-db --role-arn arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-api-deploy-cfn-role --capabilities CAPABILITY_NAMED_IAM --no-fail-on-empty-changeset --region=${AWS_DEFAULT_REGION}
      - name: Module Deploy Debug Info
        run: |
          pwd
          ls -la
          echo "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION"
          echo "vars.AWS_DEFAULT_REGION=${{ vars.AWS_DEFAULT_REGION }}"
          echo "ENV=${{ needs.set-stage.outputs.ENV }}"
          echo "MOBILE_API_STAGE=${{ needs.set-stage.outputs.MOBILE_API_STAGE }}"
          echo "BACKEND_STAGE=${{ needs.set-stage.outputs.BACKEND_STAGE }}"
          echo "FRONTEND_STAGE=${{ needs.set-stage.outputs.FRONTEND_STAGE }}"
          du -sh apps/throwtrash-web/api/src/api-dist
          du -sh apps/throwtrash-web/api/src/api-dist/node_modules || true
          du -sh apps/throwtrash-web/api/src/layer || true
          du -sh apps/throwtrash-web/api/src/layer/nodejs/node_modules || true
          find apps/throwtrash-web/api/src/layer -type l | wc -l || true
          find apps/throwtrash-web/api/src/layer -type f | wc -l || true
          du -sh apps/throwtrash-web/api/src/layer/nodejs
          aws --version
          aws sts get-caller-identity
      - name: Module Deploy
        run: |
            set -x
            # API/Lambdaのパッケージングとデプロイ
            aws cloudformation package --template-file apps/throwtrash-web/api/func-template.yml --output-template-file apps/throwtrash-web/api/package-template.yml --s3-bucket lambda-function-deployment-${{ needs.set-stage.outputs.ENV }} --s3-prefix throwtrashapi --debug
            aws cloudformation deploy --template-file apps/throwtrash-web/api/package-template.yml --stack-name throwtrash-mobile-${{ needs.set-stage.outputs.MOBILE_API_STAGE }} --parameter-overrides RunLevel=${{ vars.RUNLEVEL }} Stage=${{ needs.set-stage.outputs.MOBILE_API_STAGE }} SkillStage=${{ vars.SKILL_STAGE }} AlexaSkillID=${{ vars.ALEXA_APP_ID }} AlexaClientID=${{ secrets.ALEXA_CLIENT_ID }} AlexaClientSecret=${{ secrets.ALEXA_CLIENT_SECRET }} AlexaUserClientID=${{ secrets.ALEXA_USER_CLIENT_ID }} AuthorizationEndpoint=${{ vars.APP_URL }}/backend/${{ needs.set-stage.outputs.BACKEND_STAGE }} BackendApiKey=${{ secrets.BACKEND_API_KEY }} FrontendUrl=https://${{ vars.CF_DOMAIN_NAME }}/${{ needs.set-stage.outputs.FRONTEND_STAGE }} --role-arn arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-api-deploy-cfn-role --capabilities CAPABILITY_NAMED_IAM --no-fail-on-empty-changeset

  cloudfront-deploy:
    needs: ["frontend-deploy", "backend-deploy", "mobile-backend-deploy"]
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AWS Set up
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-frontend-deploy-role
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - name: Install CDK dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy CloudFront (primary)
        env:
          CF_STAGE: dev
          CF_DOMAIN_NAME: ${{ vars.CF_DOMAIN_NAME }}
          CF_CERT_ARN: ${{ vars.CF_CERT_ARN }}
          CF_BACKEND_API_DOMAIN: ${{ vars.CF_BACKEND_API_DOMAIN }}
          CF_MOBILE_API_DOMAIN: ${{ vars.CF_MOBILE_API_DOMAIN }}
          CF_ALARM_API_DOMAIN: ${{ vars.CF_ALARM_API_DOMAIN }}
          CF_FRONTEND_BUCKET: throwtrash-dev
        run: |
          pnpm --filter throwtrash-cloudfront run deploy:dev
      - name: Invalidate CloudFront cache
        env:
          STACK_NAME: throwtrash-cloudfront-dev
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text --region us-east-1)
          aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" --paths "/*" --region us-east-1
