name: "Backend Build"
description: "Build the backend"
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.12.0
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'pnpm'
    - name: Build backend
      shell: bash
      run: |
        pnpm --filter backend install
        pnpm --filter backend build
        pnpm --config.node-linker=hoisted --filter backend deploy --prod apps/backend/deploy
    - name: Prepare backend layer
      shell: bash
      run: |
        set -euo pipefail
        # pnpm の symlink を避けるため hoisted の node_modules をレイヤーに移す
        layer_root="apps/backend/layer/nodejs"
        rm -rf "${layer_root}"
        mkdir -p "${layer_root}"
        mv "apps/backend/deploy/node_modules" "${layer_root}/node_modules"
    - name: Archive backend
      uses: actions/upload-artifact@v4
      with:
        name: backend
        path: apps/backend/deploy
        retention-days: 1
    - name: Archive backend layer
      uses: actions/upload-artifact@v4
      with:
        name: backend-layer
        path: apps/backend/layer
        retention-days: 1
