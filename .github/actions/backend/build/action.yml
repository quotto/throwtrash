name: "Backend Build"
description: "Build the backend"
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.12.0
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'pnpm'
    - name: Build backend
      shell: bash
      run: pnpm --filter backend deploy --prod apps/throwtrash-web/backend/src/backend-dist
    # Pnpmの構造上,node_modulesはワークスペース直下の実体へのリンクになるためrsync -aLで実体をコピーする
    - name: Prepare layer directory
      shell: bash
      run: |
        layer_root="apps/throwtrash-web/backend/src/layer/nodejs"
        rm -rf "${layer_root}/node_modules"
        mkdir -p "${layer_root}/node_modules"
        rsync -aL "apps/throwtrash-web/backend/src/backend-dist/node_modules" "${layer_root}/node_modules/"
        rm -rf "apps/throwtrash-web/backend/src/backend-dist/node_modules"
    - name: Archive backend
      uses: actions/upload-artifact@v4
      with:
        name: backend
        path: apps/throwtrash-web/backend/src/backend-dist
        retention-days: 1
    - name: Archive backend layer
      uses: actions/upload-artifact@v4
      with:
        name: backend-layer
        path: apps/throwtrash-web/backend/src/layer
        retention-days: 1
