name: 'Mobile Backend Build'
description: 'Build the Mobile backend'
runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.12.0
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'pnpm'
    - name: Build
      shell: bash
      run: PNPM_NODE_LINKER=hoisted pnpm --filter api deploy --prod apps/throwtrash-web/api/src/api-dist
    - name: Prepare mobile backend layer
      shell: bash
      run: |
        set -euo pipefail
        # pnpm の symlink を避けるため hoisted の node_modules をレイヤーに移す
        layer_root="apps/throwtrash-web/api/src/layer/nodejs"
        rm -rf "${layer_root}"
        mkdir -p "${layer_root}"
        mv "apps/throwtrash-web/api/src/api-dist/node_modules" "${layer_root}/node_modules"
    - name: Archive Module
      uses: actions/upload-artifact@v4
      with:
        name: mobile-backend
        path: apps/throwtrash-web/api/src/api-dist
        retention-days: 1
    - name: Archive Layer
      uses: actions/upload-artifact@v4
      with:
        name: mobile-layer
        path: apps/throwtrash-web/api/src/layer
        retention-days: 1
