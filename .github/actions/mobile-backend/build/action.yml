name: 'Mobile Backend Build'
description: 'Build the Mobile backend'
runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.12.0
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'pnpm'
    - name: Build
      shell: bash
      run: |
        pnpm --filter mobile... install --frozen-lockfile
        pnpm --filter mobile... build
        pnpm --config.node-linker=hoisted --filter mobile... deploy --prod apps/mobile/deploy
    - name: Prepare mobile backend layer
      shell: bash
      run: |
        set -euo pipefail
        # pnpm の symlink を避けるため hoisted の node_modules をレイヤーに移す
        layer_root="apps/mobile/layer/nodejs"
        rm -rf "${layer_root}"
        mkdir -p "${layer_root}"
        mv "apps/mobile/deploy/node_modules" "${layer_root}/node_modules"
    - name: Archive Module
      uses: actions/upload-artifact@v4
      with:
        name: mobile-backend
        path: apps/mobile/deploy
        retention-days: 1
    - name: Archive Layer
      uses: actions/upload-artifact@v4
      with:
        name: mobile-layer
        path: apps/mobile/layer
        retention-days: 1
