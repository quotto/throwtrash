name: "Frontend Deploy"
description: "Deploy the frontend"
inputs:
  frontend-stage:
    description: "The frontend stage"
    required: true
  bucket:
    description: "The name of the S3 bucket"
    required: true
runs:
  using: composite
  steps:
    - name: S3 Sync
      shell: bash
      run: |
        # static ディレクトリ自体は配置せず、それ以外を同期
        aws s3 sync apps/throwtrash-web/frontend/out s3://${{ inputs.bucket }}/${{ inputs.frontend-stage }} \
          --exclude "static/*"
        # static 配下の中身のみを同一階層へ同期
        aws s3 sync apps/throwtrash-web/frontend/out/static s3://${{ inputs.bucket }}/${{ inputs.frontend-stage }}
